# Nginx reverse proxy config for interior-design platform
# Place at: /etc/nginx/sites-available/inter-des
# Enable: sudo ln -s /etc/nginx/sites-available/inter-des /etc/nginx/sites-enabled/
# SSL:    sudo certbot --nginx -d yourdomain.com

upstream node_api {
    # PM2 cluster: all instances share port 5000
    server 127.0.0.1:5000;
    keepalive 64;
}

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name yourdomain.com www.yourdomain.com;

    # --- SSL (certbot fills these in) ---
    ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # --- Gzip ---
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;

    # --- Buffer tweaks (protects Node event loop from slow clients) ---
    client_max_body_size        10m;
    client_body_buffer_size     128k;
    proxy_read_timeout          60s;
    proxy_connect_timeout       10s;

    # --- React SPA (static, served directly by Nginx — Node not involved) ---
    location / {
        root /var/www/inter-des/Frontend/dist;
        try_files $uri $uri/ /index.html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # --- API requests → Node cluster ---
    location /api/ {
        proxy_pass         http://node_api;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # --- Health check (no auth needed) ---
    location /health {
        proxy_pass http://node_api;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # --- Local uploads folder (if ever needed as fallback) ---
    location /uploads/ {
        alias /var/www/inter-des/Backend/uploads/;
        expires 30d;
        add_header Cache-Control "public";
    }

    # --- Block hidden files (.env, .git, etc.) ---
    location ~ /\. {
        deny all;
    }
}
